<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101713" />
    <meta
      name="description"
      content="Learn how Reflexo handles your privacy, locally stored reaction-time records and preferences."
    />
    <title>Privacy Policy — Reflexo</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f6f8f5;
        --surface: #ffffff;
        --surface-soft: #edf2ed;
        --foreground: #202923;
        --muted: #68736c;
        --border: #dce4dc;
        --primary: #16875d;
        --primary-soft: #e1f4e9;
        --shadow: 0 24px 70px rgb(27 48 35 / 8%);
        --glow: rgb(50 191 124 / 13%);
      }

      :root.dark {
        color-scheme: dark;
        --background: #151b1b;
        --surface: #1d2524;
        --surface-soft: #27312e;
        --foreground: #eef5ef;
        --muted: #a5b2aa;
        --border: #35413b;
        --primary: #7fe0aa;
        --primary-soft: #253c31;
        --shadow: 0 24px 70px rgb(0 0 0 / 22%);
        --glow: rgb(50 191 124 / 12%);
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% -10%, var(--glow), transparent 38rem),
          var(--background);
        color: var(--foreground);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.65;
        transition: background-color 180ms ease, color 180ms ease;
      }

      button, select { font: inherit; }

      .wrap { width: min(100% - 36px, 920px); margin-inline: auto; }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 82px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        color: var(--foreground);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: .02em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 12px;
        background: var(--primary);
        color: #10271c;
      }

      .brand-mark svg { width: 20px; height: 20px; }

      .controls { display: flex; align-items: center; gap: 9px; }

      .control {
        min-height: 40px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--foreground);
      }

      .language {
        max-width: 190px;
        padding: 0 32px 0 12px;
        cursor: pointer;
      }

      .theme-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 13px;
        cursor: pointer;
        transition: border-color 160ms ease, color 160ms ease;
      }

      .theme-button:hover, .language:hover { border-color: var(--primary); }
      .theme-button svg { width: 17px; height: 17px; }

      main { padding: 36px 0 88px; }

      .hero { max-width: 760px; margin: 10px auto 34px; text-align: center; }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        color: var(--primary);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      .eyebrow::before, .eyebrow::after {
        width: 18px;
        height: 1px;
        background: currentColor;
        content: "";
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 7vw, 4.25rem);
        font-weight: 850;
        letter-spacing: -.065em;
        line-height: 1.06;
      }

      .hero-copy {
        max-width: 620px;
        margin: 18px auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.12rem);
      }

      .updated {
        margin: 18px 0 0;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        letter-spacing: .02em;
      }

      .summary {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        margin: 0 0 24px;
        padding: 20px 22px;
        border: 1px solid color-mix(in srgb, var(--primary) 26%, var(--border));
        border-radius: 20px;
        background: var(--primary-soft);
      }

      .summary-icon {
        display: grid;
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 13px;
        background: var(--surface);
        color: var(--primary);
      }

      .summary-icon svg { width: 21px; height: 21px; }
      .summary p { margin: 0; color: var(--foreground); }
      .summary strong { color: var(--primary); }

      .policy {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .policy-section {
        display: grid;
        grid-template-columns: 54px minmax(0, 1fr);
        gap: 18px;
        padding: 27px 30px;
      }

      .policy-section + .policy-section { border-top: 1px solid var(--border); }

      .section-number {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface-soft);
        color: var(--primary);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        font-weight: 800;
      }

      .section-content h2 {
        margin: 5px 0 9px;
        font-size: 1.12rem;
        font-weight: 750;
        letter-spacing: -.02em;
        line-height: 1.35;
      }

      .section-content p { margin: 0; color: var(--muted); }
      .section-content p + p { margin-top: 10px; }
      .section-content strong { color: var(--foreground); font-weight: 650; }
      .section-content a { color: var(--primary); text-underline-offset: 3px; }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 22px 2px 0;
        color: var(--muted);
        font-size: 12px;
      }

      .footer-brand {
        color: var(--foreground);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 750;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      [dir="rtl"] .language { padding: 0 12px 0 32px; }
      [dir="rtl"] .policy-section { text-align: right; }

      @media (max-width: 600px) {
        .wrap { width: min(100% - 28px, 920px); }
        .topbar { min-height: 72px; gap: 10px; }
        .brand { gap: 8px; }
        .brand-mark { width: 34px; height: 34px; }
        .controls { gap: 6px; }
        .language { max-width: 142px; padding-inline: 9px 24px; font-size: 13px; }
        .theme-button { width: 40px; padding: 0; }
        .theme-label { display: none; }
        main { padding-top: 32px; }
        .hero { margin-bottom: 26px; }
        .summary { gap: 12px; padding: 16px; border-radius: 17px; }
        .policy { border-radius: 19px; }
        .policy-section { grid-template-columns: 38px minmax(0, 1fr); gap: 13px; padding: 21px 17px; }
        .section-number { width: 36px; height: 36px; border-radius: 12px; }
        .section-content h2 { margin-top: 3px; font-size: 1.04rem; }
        footer { align-items: flex-start; flex-direction: column; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>

    <main class="wrap">

      <footer>
        <span class="footer-brand">Reflexo · Reaction lab</span>
        <span id="footer-note"></span>
      </footer>
    </main>

      const languageSelect = document.getElementById("language");

      const themeIcon = document.getElementById("theme-icon");
      const themeLabel = document.getElementById("theme-label");

      function safeGet(key) {
        try { return localStorage.getItem(key); } catch { return null; }
      }

      function safeSet(key, value) {
        try { localStorage.setItem(key, value); } catch { /* Storage may be disabled. */ }
      }

      function renderLanguage(language) {
        const copy = content[language] || content.en;
        document.documentElement.lang = language;
        document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
        document.title = `${copy.policyLabel} — Reflexo`;
        document.querySelector('meta[name="description"]').content = copy.intro;
        languageSelect.setAttribute("aria-label", copy.languageLabel);
        document.getElementById("eyebrow").textContent = copy.eyebrow;
        document.getElementById("page-title").textContent = copy.title;
        document.getElementById("intro").textContent = copy.intro;
        document.getElementById("updated").textContent = copy.updated;
        document.getElementById("summary").innerHTML = copy.summary;
        document.getElementById("footer-note").textContent = copy.footer;
        document.getElementById("policy").innerHTML = copy.sections.map(([heading, body], index) => `
          <section class="policy-section">
            <span class="section-number" aria-hidden="true">${String(index + 1).padStart(2, "0")}</span>
            <div class="section-content">
              <h2>${heading}</h2>
              <p>${body}</p>
            </div>
          </section>
        `).join("");
      }

      function setTheme(theme, persist) {
        const dark = theme === "dark";
        document.documentElement.classList.toggle("dark", dark);
        themeButton.setAttribute("aria-pressed", String(dark));
        themeButton.setAttribute("aria-label", dark ? content[languageSelect.value].useLight : content[languageSelect.value].useDark);
        themeLabel.textContent = dark ? content[languageSelect.value].dark : content[languageSelect.value].light;
        themeIcon.innerHTML = dark
          ? '<path d="M20.9 13A8.5 8.5 0 0 1 11 3.1 8.5 8.5 0 1 0 20.9 13Z"/>'
          : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>';
        document.querySelector('meta[name="theme-color"]').content = dark ? "#151b1b" : "#f6f8f5";
        if (persist) safeSet("reflexo-theme", theme);
      }

      const storedLanguage = safeGet("reflexo-language");
      const browserLanguage = (navigator.language || "en").slice(0, 2);
      const supported = Object.keys(content);
      const initialLanguage = supported.includes(storedLanguage)
        ? storedLanguage
        : supported.includes(browserLanguage) ? browserLanguage : "en";
      languageSelect.value = initialLanguage;
      renderLanguage(initialLanguage);
      languageSelect.addEventListener("change", () => {
        safeSet("reflexo-language", languageSelect.value);
        renderLanguage(languageSelect.value);
        setTheme(document.documentElement.classList.contains("dark") ? "dark" : "light", false);
      });

      const storedTheme = safeGet("reflexo-theme");
      const initialTheme = storedTheme === "light" || storedTheme === "dark"
        ? storedTheme
        : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      setTheme(initialTheme, false);
      themeButton.addEventListener("click", () => {
